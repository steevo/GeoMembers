COM_GEOMEMBERS_FIELD_GEOMETRY_DESC="Name einer Datei in media/com_geomembers/geo (z. B. fr-departements.json) oder Pfad relativ zum Stammverzeichnis (z. B. images/karten/belgien.json). TopoJSON (empfohlen) oder GeoJSON, Koordinaten in Grad (WGS84)."
