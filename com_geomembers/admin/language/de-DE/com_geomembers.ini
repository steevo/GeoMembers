COM_GEOMEMBERS_FIELD_FOREIGN_LAYER_DESC="Ebene mit den Ländern: Nachbarländer werden um die Karte gezeichnet, andere Länder mit Mitgliedern am Rand mit ihrer Flagge angezeigt."
COM_GEOMEMBERS_FIELD_PARENT_CODE_LABEL="Code des übergeordneten Landes"
COM_GEOMEMBERS_FIELD_PARENT_CODE_DESC="Code der Zone der Länderebene, zu der diese Zonen gehören (z. B. FR für französische Départements). Deren Summe ergibt die Zahl des Landes."
COM_GEOMEMBERS_FIELD_INSETS_LABEL="Nebenkarten"
COM_GEOMEMBERS_FIELD_INSETS_DESC="Eine Nebenkarte pro Zeile: <code>Typ|Titel|Codes</code>. Typ „zoom“: Vergrößerung (z. B. <code>zoom|Île-de-France|75,77,78,91,92,93,94,95</code>). Typ „detached“: entfernte Zonen separat (z. B. <code>detached|Guadeloupe|971</code>)."
COM_GEOMEMBERS_FIELD_PLACEMENTS_LABEL="Platzierung der ausländischen Länder"
COM_GEOMEMBERS_FIELD_PLACEMENTS_DESC="Optional, ein Land pro Zeile: <code>Code|Position|Option</code>. Position „map“: auf der Karte, am als Option angegebenen Punkt (<code>Länge,Breite</code>) oder auf dem sichtbaren Teil des Landes; „left“ oder „right“: Abzeichen am linken oder rechten Rand, die Option gibt den Rang an (z. B. <code>DE|map|9,49.5</code>, <code>IT|right|1</code>). Die Zeile <code>*|right</code> (oder <code>*|left</code>) stellt alle nicht aufgeführten, auf der Karte nicht sichtbaren Länder an diesen Rand. Standardmäßig tragen auf der Karte sichtbare Länder dort ihre Beschriftung, die übrigen stehen am Rand, von Norden nach Süden."
