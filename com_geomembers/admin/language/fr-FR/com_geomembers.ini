COM_GEOMEMBERS_FIELD_GEOMETRY_LABEL="Fichier de géométrie"
COM_GEOMEMBERS_FIELD_GEOMETRY_DESC="Nom d'un fichier de media/com_geomembers/geo (ex. fr-departements.json) ou chemin relatif à la racine du site (ex. images/cartes/belgique.json). Formats TopoJSON (recommandé) ou GeoJSON, coordonnées en degrés (WGS84)."
COM_GEOMEMBERS_FIELD_OBJECT_LABEL="Objet TopoJSON"
COM_GEOMEMBERS_FIELD_OBJECT_DESC="Nom de l'objet du TopoJSON contenant les zones. Ignoré pour un GeoJSON."
