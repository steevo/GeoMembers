COM_GEOMEMBERS_GROUPINGS_INTRO="Un regroupement rassemble des zones en groupes : régions, délégations du club, continents… Les régions françaises et les continents sont fournis à l'installation."
COM_GEOMEMBERS_LAYERS_INTRO="Un découpage est un fond de carte (fichier TopoJSON ou GeoJSON) dont chaque entité devient une zone. Les zones manquantes sont créées à l'enregistrement."
COM_GEOMEMBERS_GROUPS="Groupes"
