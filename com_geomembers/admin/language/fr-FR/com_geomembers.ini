COM_GEOMEMBERS_FIELD_FOREIGN_LAYER_LABEL="Découpage des pays"
COM_GEOMEMBERS_FIELD_FOREIGN_LAYER_DESC="Découpage contenant les pays : les pays voisins sont dessinés autour de la carte et les autres pays ayant des adhérents sont affichés en marge avec leur drapeau."
COM_GEOMEMBERS_FIELD_PARENT_CODE_LABEL="Code du pays parent"
COM_GEOMEMBERS_FIELD_PARENT_CODE_DESC="Code de la zone du découpage des pays à laquelle appartiennent ces zones (ex. FR pour les départements français). Son total devient la somme des zones."
COM_GEOMEMBERS_FIELD_INSETS_LABEL="Encarts"
COM_GEOMEMBERS_FIELD_INSETS_DESC="Un encart par ligne : <code>type|titre|codes</code>. Type « zoom » : agrandissement (ex. <code>zoom|Île-de-France|75,77,78,91,92,93,94,95</code>). Type « detached » : zones éloignées affichées à part (ex. <code>detached|Guadeloupe|971</code>)."
COM_GEOMEMBERS_FIELD_PLACEMENTS_LABEL="Placement des pays étrangers"
COM_GEOMEMBERS_FIELD_PLACEMENTS_DESC="Facultatif, un pays par ligne : <code>code|position|option</code>. Position « map » : sur la carte, au point indiqué en option (<code>longitude,latitude</code>) ou sur la partie visible du pays ; « left » ou « right » : badge dans la marge gauche ou droite, l'option donnant le rang (ex. <code>DE|map|9,49.5</code>, <code>IT|right|1</code>). La ligne <code>*|right</code> (ou <code>*|left</code>) envoie dans cette marge tous les pays non cités qui ne sont pas visibles sur la carte. Par défaut, les pays visibles sur la carte y portent leur étiquette et les autres vont en marge, du nord au sud."
COM_GEOMEMBERS_FIELD_ATTRIBUTION_LABEL="Source et licence"
COM_GEOMEMBERS_FIELD_ATTRIBUTION_DESC="Mention affichée sous la carte (obligatoire pour certaines licences, ex. CC BY)."
