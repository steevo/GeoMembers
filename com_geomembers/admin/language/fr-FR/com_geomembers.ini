COM_GEOMEMBERS_ASSIGNMENTS="Affectation des zones"
COM_GEOMEMBERS_ASSIGNMENTS_DESC="Choisissez le groupe de chaque zone. Des pays peuvent aussi être rattachés à un groupe (ex. une délégation qui couvre la Belgique)."
COM_GEOMEMBERS_ASSIGNMENTS_SAVE_FIRST="Enregistrez le regroupement et ses groupes pour pouvoir affecter les zones."
COM_GEOMEMBERS_ASSIGNMENTS_NO_GROUPS="Ajoutez au moins un groupe puis enregistrez pour affecter les zones."
