COM_GEOMEMBERS_COUNTS_DESC="Saisissez les effectifs à la maille la plus fine connue (département pour la France, pays ailleurs). Les totaux par pays, région ou regroupement sont calculés automatiquement. Un nombre saisi sur un pays qui a des subdivisions (ex. France) compte comme « non ventilé »."
