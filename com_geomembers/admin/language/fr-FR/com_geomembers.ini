COM_GEOMEMBERS_IMPORT_CSV_DESC="Colonnes séparées par « ; » ou « , » : <code>découpage;code;effectif</code>, <code>code;effectif</code> ou le format de l'export. Les zones présentes dans le fichier remplacent les valeurs actuelles ; les autres sont conservées."
