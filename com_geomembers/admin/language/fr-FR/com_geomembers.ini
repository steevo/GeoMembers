COM_GEOMEMBERS_FIELD_NAME_PROPERTY_LABEL="Propriété du nom"
COM_GEOMEMBERS_FIELD_NAME_PROPERTY_DESC="Si une propriété suffixée par la langue existe (ex. name_fr), elle est utilisée en priorité."
COM_GEOMEMBERS_FIELD_PROJECTION_LABEL="Projection"
