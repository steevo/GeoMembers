COM_GEOMEMBERS_FIELD_PARENT_CODE_DESC="Code of the zone of the countries layer these zones belong to (e.g. FR for French departments). Its total becomes the sum of the zones."
COM_GEOMEMBERS_FIELD_INSETS_LABEL="Insets"
COM_GEOMEMBERS_FIELD_INSETS_DESC="One inset per line: <code>type|title|codes</code>. Type “zoom”: enlargement (e.g. <code>zoom|Île-de-France|75,77,78,91,92,93,94,95</code>). Type “detached”: remote zones shown apart (e.g. <code>detached|Guadeloupe|971</code>)."
COM_GEOMEMBERS_FIELD_PLACEMENTS_LABEL="Placement of foreign countries"
COM_GEOMEMBERS_FIELD_PLACEMENTS_DESC="Optional, one country per line: <code>code|position|option</code>. Position &quot;map&quot;: on the map, at the point given as option (<code>longitude,latitude</code>) or on the visible part of the country; &quot;left&quot; or &quot;right&quot;: badge in the left or right margin, the option giving the rank (e.g. <code>DE|map|9,49.5</code>, <code>IT|right|1</code>). The line <code>*|right</code> (or <code>*|left</code>) sends every unlisted country that is not visible on the map to that margin. By default, countries visible on the map carry their label there and the others go to the margins, from north to south."
