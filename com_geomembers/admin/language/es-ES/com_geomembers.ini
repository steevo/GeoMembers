COM_GEOMEMBERS_FIELD_GEOMETRY_DESC="Nombre de un archivo de media/com_geomembers/geo (p. ej. fr-departements.json) o ruta relativa a la raíz del sitio (p. ej. images/mapas/belgica.json). TopoJSON (recomendado) o GeoJSON, coordenadas en grados (WGS84)."
