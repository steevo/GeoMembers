COM_GEOMEMBERS_FIELD_FOREIGN_LAYER_DESC="Capa que contiene los países: los países vecinos se dibujan alrededor del mapa y los demás países con socios se muestran en el margen con su bandera."
COM_GEOMEMBERS_FIELD_PARENT_CODE_LABEL="Código del país principal"
COM_GEOMEMBERS_FIELD_PARENT_CODE_DESC="Código de la zona de la capa de países a la que pertenecen estas zonas (p. ej. FR para los departamentos franceses). Su total pasa a ser la suma de las zonas."
COM_GEOMEMBERS_FIELD_INSETS_LABEL="Recuadros"
COM_GEOMEMBERS_FIELD_INSETS_DESC="Un recuadro por línea: <code>tipo|título|códigos</code>. Tipo «zoom»: ampliación (p. ej. <code>zoom|Île-de-France|75,77,78,91,92,93,94,95</code>). Tipo «detached»: zonas alejadas mostradas aparte (p. ej. <code>detached|Guadeloupe|971</code>)."
COM_GEOMEMBERS_FIELD_PLACEMENTS_LABEL="Ubicación de los países extranjeros"
COM_GEOMEMBERS_FIELD_PLACEMENTS_DESC="Opcional, un país por línea: <code>código|posición|opción</code>. Posición «map»: en el mapa, en el punto indicado como opción (<code>longitud,latitud</code>) o en la parte visible del país; «left» o «right»: insignia en el margen izquierdo o derecho, la opción indica el orden (p. ej. <code>DE|map|9,49.5</code>, <code>IT|right|1</code>). La línea <code>*|right</code> (o <code>*|left</code>) envía a ese margen todos los países no indicados que no se ven en el mapa. Por defecto, los países visibles en el mapa llevan allí su etiqueta y los demás van a los márgenes, de norte a sur."
COM_GEOMEMBERS_FIELD_ATTRIBUTION_LABEL="Fuente y licencia"
COM_GEOMEMBERS_FIELD_ATTRIBUTION_DESC="Mención mostrada bajo el mapa (obligatoria con algunas licencias, p. ej. CC BY)."
